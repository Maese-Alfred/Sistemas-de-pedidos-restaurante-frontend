# ================================================================
# CI Pipeline — Sistemas-de-pedidos-restaurante-frontend
# ================================================================
# Quality gates: TypeScript · ESLint · Vitest (70 % cov) · SonarCloud · Build
# Target duration: < 5 min
# ================================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# ── Concurrency ────────────────────────────────────────────────
# Cancel in-flight runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Permissions ────────────────────────────────────────────────
permissions:
  contents: read
  pull-requests: read        # Needed for SonarCloud PR decoration

# ===============================================================
# JOBS
# ===============================================================

jobs:

  # ─────────────────────────────────────────────────────────────
  # 1. Install + cache dependencies (shared by all downstream jobs)
  # ─────────────────────────────────────────────────────────────
  install:
    name: 📦 Install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Cache the whole node_modules so downstream jobs skip npm ci
      - uses: actions/cache/save@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

  # ─────────────────────────────────────────────────────────────
  # 2a. Lint (parallel with typecheck)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────
  # 2b. TypeScript type-check (parallel with lint)
  # ─────────────────────────────────────────────────────────────
  typecheck:
    name: 🔠 TypeCheck
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: TypeScript compile check
        run: npx --no-install tsc -b

  # ─────────────────────────────────────────────────────────────
  # 3. Tests + Coverage
  # ─────────────────────────────────────────────────────────────
  test:
    name: 🧪 Test
    needs: [lint, typecheck]
    runs-on: ubuntu-latest
    env:
      VITE_USE_MOCK: "true"          # No backend needed in CI
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Run Vitest with coverage
        run: npm run test:coverage

      # Persist coverage for SonarCloud and artifact upload
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 4. SonarCloud analysis (MANDATORY)
  # ─────────────────────────────────────────────────────────────
  sonarcloud:
    name: ☁️ SonarCloud
    needs: test
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is REQUIRED — Sonar needs full history for
      # new-code detection and blame information.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Download the coverage report generated by the test job
      - uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io

      # Fail the pipeline if the SonarCloud quality gate is not passed
      - name: SonarCloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # ─────────────────────────────────────────────────────────────
  # 5. Production build
  # ─────────────────────────────────────────────────────────────
  build:
    name: 🏗️ Build
    needs: sonarcloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/cache/restore@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # 6. Docker validation (only on main / develop)
  # ─────────────────────────────────────────────────────────────
  docker:
    name: 🐳 Docker
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Docker build
        run: |
          docker build -f Dockerfile.frontend -t frontend-ci-test .
          echo "Docker image built successfully"
          docker images frontend-ci-test --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"
